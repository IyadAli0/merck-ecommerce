services:
  backend:
    build:
      context: ./backend
    image: merck-backend:1.0
    container_name: merck-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: merck-frontend:1.0
    container_name: merck-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
  